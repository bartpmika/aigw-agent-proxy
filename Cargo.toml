[package]
name = "aigw-agent-proxy"
version = "0.1.0"
edition = "2021"
description = "Local forward proxy that puts AI agents (Claude Code, Codex, ...) behind Prisma AIRS AI Gateway governance"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rand = "0.8"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "json", "gzip", "http2"] }
rsa = { version = "0.9", features = ["pem", "sha2"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
urlencoding = "2"
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[features]
# Full gateway (phase 2): API mode, 76-provider engine, prompts, validation.
# The default build is the forward proxy (Anthropic/OpenAI targets).
gateway = []

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
